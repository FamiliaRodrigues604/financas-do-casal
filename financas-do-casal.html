<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Spline+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6f1e7;
    --paper-2:#efe7d7;
    --card:#fffdf8;
    --ink:#2a2620;
    --ink-soft:#6b6457;
    --line:#e3d9c6;
    --forest:#2f5d50;
    --forest-deep:#234a40;
    --gold:#bd8b3c;
    --gold-soft:#e9d4a6;
    --coral:#c0563f;
    --coral-soft:#f3d9d0;
    --mint:#dfeae3;
    --shadow:0 1px 2px rgba(42,38,32,.05),0 8px 24px -12px rgba(42,38,32,.18);
    --display:'Fraunces',Georgia,'Times New Roman',serif;
    --body:'Spline Sans',ui-sans-serif,system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--body);
    color:var(--ink);
    background:
      radial-gradient(1200px 600px at 90% -10%, rgba(189,139,60,.10), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(47,93,80,.10), transparent 55%),
      var(--paper);
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 80px}
  /* Header */
  header.top{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
  .brand{display:flex;align-items:center;gap:14px}
  .seal{width:46px;height:46px;border-radius:50%;background:var(--forest);color:var(--gold-soft);
    display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:22px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.15), var(--shadow);flex:none}
  .brand h1{font-family:var(--display);font-weight:600;font-size:26px;letter-spacing:-.01em;line-height:1.05}
  .brand .sub{font-size:13px;color:var(--ink-soft)}
  .names{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);cursor:pointer;
    border:1px dashed var(--line);padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.4)}
  .names:hover{border-color:var(--gold);color:var(--ink)}
  .names b{color:var(--forest);font-weight:600}

  /* Month bar */
  .monthbar{display:flex;align-items:center;gap:10px;margin-bottom:20px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px;box-shadow:var(--shadow);width:fit-content}
  .monthbar button{border:none;background:transparent;cursor:pointer;font-size:18px;color:var(--ink-soft);
    width:34px;height:34px;border-radius:9px;display:grid;place-items:center}
  .monthbar button:hover{background:var(--paper-2);color:var(--ink)}
  .monthbar .mlabel{font-family:var(--display);font-weight:600;font-size:16px;min-width:148px;text-align:center;text-transform:capitalize}

  /* Tabs */
  nav.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:2px solid var(--line);margin-bottom:24px}
  nav.tabs button{border:none;background:transparent;cursor:pointer;font-family:var(--body);font-weight:600;
    font-size:14.5px;color:var(--ink-soft);padding:11px 16px;border-radius:10px 10px 0 0;position:relative;transition:color .15s}
  nav.tabs button:hover{color:var(--ink)}
  nav.tabs button.active{color:var(--forest)}
  nav.tabs button.active::after{content:"";position:absolute;left:8px;right:8px;bottom:-2px;height:3px;
    background:var(--forest);border-radius:3px}

  section{display:none;animation:rise .35s ease both}
  section.show{display:block}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* Cards & grids */
  .grid{display:grid;gap:16px}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g2{grid-template-columns:1.3fr .7fr}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
  .card h3{font-family:var(--display);font-weight:600;font-size:17px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .stat{padding:18px}
  .stat .k{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);font-weight:600}
  .stat .v{font-family:var(--display);font-size:30px;font-weight:600;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .stat .v.pos{color:var(--forest)}
  .stat .v.neg{color:var(--coral)}
  .stat .hint{font-size:12.5px;color:var(--ink-soft);margin-top:4px}
  .stat.accent{background:linear-gradient(160deg,var(--forest),var(--forest-deep));color:#f4eedf;border-color:transparent}
  .stat.accent .k{color:rgba(244,238,223,.75)}
  .stat.accent .v{color:#fff}
  .stat.accent .hint{color:rgba(244,238,223,.8)}

  /* Forms */
  .formrow{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
  .field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:120px}
  .field label{font-size:12px;font-weight:600;color:var(--ink-soft);letter-spacing:.02em}
  input,select{font-family:var(--body);font-size:14px;color:var(--ink);background:var(--paper);
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;transition:border-color .15s,box-shadow .15s}
  input:focus,select:focus{outline:none;border-color:var(--forest);box-shadow:0 0 0 3px rgba(47,93,80,.12);background:#fff}
  .btn{font-family:var(--body);font-weight:600;font-size:14px;cursor:pointer;border:none;border-radius:10px;
    padding:10px 18px;background:var(--forest);color:#fff;transition:transform .1s,filter .15s;white-space:nowrap}
  .btn:hover{filter:brightness(1.08)}
  .btn:active{transform:translateY(1px)}
  .btn.gold{background:var(--gold)}
  .btn.ghost{background:transparent;color:var(--forest);box-shadow:inset 0 0 0 1.5px var(--forest)}
  .btn.sm{padding:7px 12px;font-size:13px}

  /* Lists */
  .list{display:flex;flex-direction:column}
  .row{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .dot{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex:none}
  .dot.in{background:var(--mint);color:var(--forest)}
  .dot.out{background:var(--coral-soft);color:var(--coral)}
  .row .meta{flex:1;min-width:0}
  .row .meta .t{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .meta .s{font-size:12.5px;color:var(--ink-soft)}
  .row .amt{font-family:var(--display);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
  .row .amt.in{color:var(--forest)}
  .row .amt.out{color:var(--coral)}
  .tag{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--paper-2);color:var(--ink-soft)}
  .x{border:none;background:transparent;color:var(--ink-soft);cursor:pointer;font-size:17px;width:30px;height:30px;border-radius:8px;flex:none}
  .x:hover{background:var(--coral-soft);color:var(--coral)}
  .empty{text-align:center;color:var(--ink-soft);padding:30px 10px;font-size:14px}
  .empty .big{font-size:30px;margin-bottom:8px;opacity:.5}

  /* Progress */
  .bar{height:9px;background:var(--paper-2);border-radius:99px;overflow:hidden}
  .bar > span{display:block;height:100%;border-radius:99px;background:var(--forest);transition:width .5s ease}
  .bar > span.warn{background:var(--gold)}
  .bar > span.over{background:var(--coral)}
  .budline{padding:13px 0;border-bottom:1px solid var(--line)}
  .budline.clickable{cursor:pointer;border-radius:10px;padding:13px 8px;margin:0 -8px;transition:background .12s}
  .budline.clickable:hover{background:var(--paper-2)}
  .budline:last-child{border-bottom:none}
  .budline .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:10px}
  .budline .head .nm{font-weight:600;font-size:14px}
  .budline .head .num{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .budline .head .num b{color:var(--ink);font-weight:600}

  /* Goals */
  .goal{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--paper)}
  .goal .gh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
  .goal .gh .nm{font-family:var(--display);font-weight:600;font-size:17px}
  .goal .gh .dl{font-size:12px;color:var(--ink-soft)}
  .goal .gnum{display:flex;justify-content:space-between;font-size:13px;margin:8px 0;font-variant-numeric:tabular-nums}
  .goal .gnum .saved{color:var(--forest);font-weight:600}
  .goal .gnum .target{color:var(--ink-soft)}
  .goal .gact{display:flex;gap:8px;margin-top:12px}
  .goal .gact input{flex:1}
  .pct{font-family:var(--display);font-weight:600;color:var(--forest)}

  /* Debt */
  .debt{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--paper);margin-bottom:12px}
  .debt:last-child{margin-bottom:0}
  .debt .dh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .debt .dh .nm{font-family:var(--display);font-weight:600;font-size:17px}
  .debt .dh .due{font-size:12px;color:var(--ink-soft)}
  .debt .pgrid{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 10px}
  .pchip{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:600;
    border:1px solid var(--line);background:#fff;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .pchip.paid{background:var(--forest);color:#fff;border-color:var(--forest)}
  .debt .dfoot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;
    font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .debt .dfoot b{color:var(--ink)}

  .sectionhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .sectionhead .lead{font-family:var(--display);font-size:21px;font-weight:600}
  .sectionhead .desc{font-size:13.5px;color:var(--ink-soft);max-width:520px}

  .filterbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .chip{font-size:13px;font-weight:600;padding:7px 14px;border-radius:999px;border:1px solid var(--line);
    background:var(--card);color:var(--ink-soft);cursor:pointer}
  .chip.on{background:var(--forest);color:#fff;border-color:var(--forest)}

  .donutwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .legend{display:flex;flex-direction:column;gap:7px;font-size:13px;flex:1;min-width:150px}
  .legend .li{display:flex;align-items:center;gap:8px;cursor:pointer;border-radius:8px;padding:3px 4px;margin:-3px -4px;transition:background .12s}
  .legend .li:hover{background:var(--paper-2)}
  .legend .sw{width:11px;height:11px;border-radius:3px;flex:none}
  .legend .lt{flex:1;color:var(--ink-soft)}
  .legend .lv{font-weight:600;font-variant-numeric:tabular-nums}
  .donutseg{cursor:pointer;transition:opacity .12s}
  .donutseg:hover{opacity:.75}

  /* filtro ativo (categoria/natureza) */
  .activefilter{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--mint);
    border:1px solid var(--forest);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13.5px}
  .activefilter b{color:var(--forest-deep)}
  .activefilter .clearf{border:none;background:var(--forest);color:#fff;font-weight:600;font-size:12px;
    padding:5px 11px;border-radius:999px;cursor:pointer}

  /* separadores de natureza na lista de lançamentos */
  .txgroup-head{display:flex;align-items:center;gap:8px;font-family:var(--body);font-weight:700;font-size:12px;
    text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);padding:16px 4px 8px;
    border-top:1px solid var(--line)}
  .txgroup-head:first-child{border-top:none;padding-top:4px}
  .txgroup-head .cnt{font-weight:600;background:var(--paper-2);border-radius:999px;padding:1px 9px;font-size:11px;letter-spacing:0;text-transform:none}

  .loader{display:grid;place-items:center;height:60vh;color:var(--ink-soft);gap:14px}
  .spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--forest);border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .footnote{text-align:center;font-size:12px;color:var(--ink-soft);margin-top:36px}

  @media(max-width:760px){
    .g3{grid-template-columns:1fr}
    .g2{grid-template-columns:1fr}
    .brand h1{font-size:22px}
    nav.tabs button{padding:10px 11px;font-size:13.5px}
  }
</style>

<script>
(function(){
  "use strict";

  /* ---------- storage (Supabase — funciona em qualquer navegador/arquivo) ---------- */
  const SUPABASE_URL = 'https://ctkfbghpsafmyinvwbzv.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_guqTcabXyGBiKLeGlyk5og_ns2P-4OQ';
  const SB_HEADERS = { apikey: SUPABASE_KEY, Authorization: 'Bearer '+SUPABASE_KEY };

  const storage = {
    async get(key){
      try{
        const res = await fetch(SUPABASE_URL+'/rest/v1/app_storage?key=eq.'+encodeURIComponent(key)+'&select=value', { headers: SB_HEADERS });
        if(!res.ok) return null;
        const rows = await res.json();
        if(!rows.length) return null;
        return { key, value: rows[0].value, shared:false };
      }catch(e){ console.error('storage.get falhou', e); return null; }
    },
    async set(key, value){
      try{
        const res = await fetch(SUPABASE_URL+'/rest/v1/app_storage', {
          method:'POST',
          headers: Object.assign({}, SB_HEADERS, {'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'}),
          body: JSON.stringify({ key, value, updated_at: new Date().toISOString() })
        });
        if(!res.ok) throw new Error('HTTP '+res.status);
        return { key, value, shared:false };
      }catch(e){ console.error('storage.set falhou', e); return null; }
    },
    async delete(key){
      try{
        await fetch(SUPABASE_URL+'/rest/v1/app_storage?key=eq.'+encodeURIComponent(key), { method:'DELETE', headers: SB_HEADERS });
        return { key, deleted:true };
      }catch(e){ console.error('storage.delete falhou', e); return null; }
    },
    async list(prefix){
      try{
        let url = SUPABASE_URL+'/rest/v1/app_storage?select=key';
        if(prefix) url += '&key=like.'+encodeURIComponent(prefix)+'*';
        const res = await fetch(url, { headers: SB_HEADERS });
        const rows = await res.json();
        return { keys: rows.map(r=>r.key) };
      }catch(e){ console.error('storage.list falhou', e); return { keys: [] }; }
    }
  };
  async function load(key, fb){
    try{ const r=await storage.get(key,false); return (r&&r.value!=null)?JSON.parse(r.value):fb; }
    catch(e){ return fb; }
  }
  async function save(key, data){
    try{ await storage.set(key, JSON.stringify(data), false); }
    catch(e){ console.error('save '+key+' falhou', e); }
  }

  /* ---------- state ---------- */
  const State = {
    profile:{a:"Thiago", b:"Lu"},
    tx:[],            // {id,type:'in'|'out',amount,cat,date,desc,who}
    budget:[],        // {cat, limit}
    goals:[],         // {id,name,target,saved,deadline}
    debts:[],         // {id,name,total,n,paid,due,start}
    fixed:[]          // {id,name,cat,amount,dueDay,who}
  };
  let month = ymNow();          // 'YYYY-MM'
  let txFilter = 'all';         // all|in|out
  let lens = 'competencia';     // 'competencia' (mês da compra) | 'caixa' (mês do pagamento)
  let yearSel = null;           // 'YYYY' — ano exibido no Panorama Anual
  let txCatFilter = null;       // categoria ativa ao clicar num gráfico ('Mercado', 'Saúde'...)
  let txKindFilter = null;      // natureza ativa ao clicar em Composição das despesas ('fixa'|'variavel'|'parcela')

  let CAT_OUT = ["Mercado","Fruteira","Gasolina","Farmácia","Lazer","Restaurante","Padaria","Lanches","Roupas e outros","Casa","Casa Sitio","Academia","Cuidados pessoais","Produto Mega Hair","Pet","Mercado Livre","Shopee","NetFlix","Assinaturas","Cursos","Celular","Uber","Pedagio","Lavar carro","Seguro carro","Manutenção","Material escolar","Uniforme","Vacina","Sesi","Artesanato","Jogo","Airbnb","Impressão","Serviços","Serviços cartorio","Presente","Débitos","Rotativo","Avila","A revisar","Outros"];
  let CAT_IN  = ["Salário","Barbearia","Gelateria","Aluguel","Investimentos","Estorno","Presente","Outros"];
  const CAT_ICON = {Mercado:"🛒",Fruteira:"🍎",Gasolina:"⛽",Farmácia:"➕",Lazer:"🎬",Restaurante:"🍽️",Padaria:"🥐",Lanches:"🍫",["Roupas e outros"]:"👕",Casa:"🏠",["Casa Sitio"]:"🌳",Academia:"🏋️",["Cuidados pessoais"]:"💇",["Produto Mega Hair"]:"💈",Pet:"🐾",["Mercado Livre"]:"📦",Shopee:"🛍️",NetFlix:"📺",Assinaturas:"🔄",Cursos:"📚",Celular:"📱",Uber:"🚗",Pedagio:"🛣️",["Lavar carro"]:"🧽",["Seguro carro"]:"🛡️",Manutenção:"🔧",["Material escolar"]:"✏️",Uniforme:"👔",Vacina:"💉",Sesi:"🏫",Artesanato:"🎨",Jogo:"🎮",Airbnb:"🏨",Impressão:"🖨️",Serviços:"🧰",["Serviços cartorio"]:"📜",Presente:"🎁",Débitos:"💳",Rotativo:"♻️",Avila:"•",["A revisar"]:"❓",Outros:"•",Salário:"💼",Barbearia:"💈",Gelateria:"🍦",Aluguel:"🏘️",Investimentos:"📈",Estorno:"↩️"};
  Object.assign(CAT_ICON,{"Dízimo":"⛪","Moradia":"🏢","Saúde":"🩺","Escola":"🎒"});
  const PALETTE = ["#2f5d50","#bd8b3c","#c0563f","#5b8a72","#7a6cae","#3f7a8a","#a8743f","#94794a","#b85c7e","#56707d"];

  /* ---------- helpers ---------- */
  function ymNow(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
  function fmt(n){ return (n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
  function fmtShort(n){ return (n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function monthLabel(ym){ const [y,m]=ym.split("-"); const d=new Date(+y,+m-1,1);
    return d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}); }
  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function txOfMonth(ym){
    if(lens==='caixa') return State.tx.filter(t=> (t.comp || (t.date||"").slice(0,7))===ym);
    // competência (mês da compra): agrupa pela data real, ignora o mês de pagamento
    return State.tx.filter(t=> (t.date||"").slice(0,7)===ym);
  }
  function busiestMonth(){
    const c={};
    State.tx.forEach(t=>{ const k = (lens==='caixa') ? (t.comp||(t.date||"").slice(0,7)) : (t.date||"").slice(0,7); if(k) c[k]=(c[k]||0)+1; });
    let best=null,bn=-1; for(const k in c){ if(c[k]>bn){bn=c[k];best=k;} }
    return best || ymNow();
  }
  function sum(arr){ return arr.reduce((a,b)=>a+b,0); }
  // classifica uma despesa: fixa (recorrente), parcela (compra parcelada/dívida) ou variável
  function txKind(t){
    if(t.type!=='out') return 'in';
    if(t.fixedId) return 'fixa';
    if(t.parc || /parcela|\d{1,2}\s*\/\s*\d{1,2}/i.test(t.desc||'')) return 'parcela';
    return 'variavel';
  }
  const KIND_LABEL = {fixa:'Fixas (recorrentes)', variavel:'Variáveis (do mês)', parcela:'Parcelas (dívida do cartão)'};

  // agrupa despesas por origem, para separar visualmente na aba Lançamentos:
  // fixa (recorrente lançada automaticamente), importada (veio de fatura/cartão) ou avulsa (digitada manualmente)
  function txGroup(t){
    if(t.type!=='out') return 'receita';
    if(t.fixedId) return 'fixa';
    if(t.imp || String(t.id||'').indexOf('seed')===0) return 'importada';
    return 'avulsa';
  }
  const GROUP_LABEL = {receita:'Receitas', fixa:'Fixas', importada:'Importadas do cartão', avulsa:'Lançamentos do mês'};
  const GROUP_ICON  = {receita:'💰', fixa:'🔁', importada:'💳', avulsa:'🧾'};

  /* navegação por clique nos gráficos/composição */
  function goToCategoryTx(cat){
    txCatFilter = cat; txKindFilter = null; txFilter='out';
    renderAll();

    updateLensChips(); renderLensHint();
    renderAll();
  }

  function updateLensChips(){
    document.querySelectorAll('[data-lens]').forEach(x=> x.classList.toggle('on', x.dataset.lens===lens));
  }

  // Mostra quantos lançamentos ficariam visíveis/ocultos neste mês se a OUTRA lente estivesse ativa —
  // evita a confusão de "lancei e não apareceu" quando compra e pagamento caem em meses diferentes.
  function renderLensHint(){
    const hint = document.getElementById('lensHint'); if(!hint) return;
    const otherKey = t => lens==='caixa' ? (t.date||"").slice(0,7) : (t.comp || (t.date||"").slice(0,7));
    const curKey   = t => lens==='caixa' ? (t.comp || (t.date||"").slice(0,7)) : (t.date||"").slice(0,7);
    const hiddenHere = State.tx.filter(t=> otherKey(t)===month && curKey(t)!==month).length;
    const lensNm = lens==='caixa' ? 'mês do pagamento' : 'mês da compra';
    const otherNm = lens==='caixa' ? 'mês da compra' : 'mês do pagamento';
    hint.innerHTML = hiddenHere>0
      ? `Vendo por <b>${lensNm}</b> · ${hiddenHere} lançamento(s) deste período estão em outro mês porque foram registrados por <b>${otherNm}</b> — troque a lente acima para vê-los aqui.`
      : `Vendo por <b>${lensNm}</b>.`;
  }

  function shiftMonth(d){
    let [y,m]=month.split("-").map(Number); m+=d;
    while(m<1){m+=12;y--;} while(m>12){m-=12;y++;}
    month = y+"-"+String(m).padStart(2,"0");
    document.getElementById('mLabel').textContent = monthLabel(month);
    renderLensHint();
    renderAll();
  }

  function switchTab(tab, btn){
    document.querySelectorAll('#tabs button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('section').forEach(s=>s.classList.remove('show'));
    document.getElementById('sec-'+tab).classList.add('show');
  }

  /* ---------- DASHBOARD ---------- */
  function renderDash(){

    const income = sum(list.filter(t=>t.type==='in').map(t=>t.amount));

    const totalSaved = sum(State.goals.map(g=>g.saved||0));
    const totalGoal  = sum(State.goals.map(g=>g.target||0));
    const debtRemain = sum(State.debts.map(d=> (d.n-(d.paid||0)) * (d.total/d.n) ));

    document.getElementById('sec-dash').innerHTML = `
      <div class="grid g3" style="margin-bottom:16px">
        <div class="card stat"><div class="k">Receitas do mês</div><div class="v pos">${fmt(income)}</div><div class="hint">${list.filter(t=>t.type==='in').length} entrada(s)</div></div>
        <div class="card stat"><div class="k">Despesas do mês</div><div class="v neg">${fmt(expense)}</div><div class="hint">${list.filter(t=>t.type==='out').length} saída(s)</div></div>
        <div class="card stat accent"><div class="k">Saldo do mês</div><div class="v">${fmt(balance)}</div><div class="hint">${balance>=0?`Vocês pouparam ${savingRate}% da renda`:`Atenção: gastaram mais do que entrou`}</div></div>
      </div>

      ${(()=>{
        const outs=list.filter(t=>t.type==='out');
        const fixK=sum(outs.filter(t=>txKind(t)==='fixa').map(t=>t.amount));
        const parK=sum(outs.filter(t=>txKind(t)==='parcela').map(t=>t.amount));
        const varK=sum(outs.filter(t=>txKind(t)==='variavel').map(t=>t.amount));
        const tot=fixK+parK+varK; if(tot===0) return '';
        const row=(lbl,val,color,note,kind)=>`<div class="budline clickable" data-kind="${kind}" title="Ver lançamentos desta natureza">
          <div class="head"><span class="nm">${lbl}</span><span class="num"><b>${fmt(val)}</b> · ${Math.round(val/tot*100)}%</span></div>
          <div class="bar"><span style="width:${val/tot*100}%;background:${color}"></span></div>

          <div class="desc" style="margin-bottom:8px">Separadas por natureza. Parcelas são <b>pagamento de dívida</b> (compras passadas), não gasto fixo nem novo. Clique numa linha para ver os lançamentos.</div>
          ${row('🔁 Fixas (recorrentes)', fixK, 'var(--forest)', 'aluguel, escola, seguros, assinaturas…', 'fixa')}
          ${row('🛒 Variáveis (do mês)', varK, 'var(--gold)', 'mercado, gasolina, lazer, farmácia…', 'variavel')}
          ${row('💳 Parcelas (dívida do cartão)', parK, 'var(--coral)', 'compras parceladas que estão sendo quitadas', 'parcela')}

      })()}

      <div class="grid g2">
        <div class="card">
          <h3>🍩 Despesas por categoria</h3>

  function donut(cats, total, clickable){
    if(clickable===undefined) clickable=true;
    const size=150, r=58, cx=size/2, cy=size/2, sw=24, C=2*Math.PI*r;
    let acc=0, segs="";
    cats.forEach(([cat,val],i)=>{
      const frac=val/total, off=C*(1-frac), rot=acc*360-90; acc+=frac;
      segs+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${PALETTE[i%PALETTE.length]}"
        stroke-width="${sw}" stroke-dasharray="${C}" stroke-dashoffset="${off}"
        transform="rotate(${rot} ${cx} ${cy})" stroke-linecap="butt" ${clickable?`class="donutseg" data-cat="${esc(cat)}"`:''}><title>${esc(cat)}</title></circle>`;
    });
    const legend = cats.slice(0,7).map(([cat,val],i)=>`
      <div class="li" ${clickable?`data-cat="${esc(cat)}" title="Ver lançamentos de ${esc(cat)}"`:''}><span class="sw" style="background:${PALETTE[i%PALETTE.length]}"></span>
      <span class="lt">${esc(cat)}</span><span class="lv">${Math.round(val/total*100)}%</span></div>`).join("");
    return `<div class="donutwrap">
      <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex:none">
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--paper-2)" stroke-width="${sw}"/>
        ${segs}
        <text x="${cx}" y="${cy-4}" text-anchor="middle" font-family="var(--display)" font-size="13" fill="var(--ink-soft)">Total</text>
        <text x="${cx}" y="${cy+14}" text-anchor="middle" font-family="var(--display)" font-weight="600" font-size="15" fill="var(--ink)">${fmtShort(total)}</text>
      </svg>
      <div class="legend">${legend}</div></div>`;
  }

  let editingTxId = null;

  function addMonthsISO(iso, k){
    const p=String(iso).split('-').map(Number); const y=p[0], m=p[1], d=p[2];
    let mm=m-1+k; const yy=y+Math.floor(mm/12); mm=((mm%12)+12)%12;
    const dim=new Date(yy,mm+1,0).getDate(); const day=Math.min(d,dim);
    return yy+'-'+String(mm+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
  }

      const sb=sec.querySelector('#eSave'); if(sb) sb.onclick=()=>saveEditTx(editingTxId);

  function addTx(){
    const g=id=>document.getElementById(id);
    const amount=parseFloat(g('txAmt').value);
    if(!amount||amount<=0){ g('txAmt').focus(); return; }
    const type=g('txType').value, cat=g('txCat').value, who=g('txWho').value;
    const desc=g('txDesc').value.trim();
    const baseDate=g('txDate').value||todayISO();
    const dueVal=g('txDue').value||"";
    const parc=Math.max(1, parseInt(g('txParc').value)||1);
    const asDebt=g('txAsDebt').checked;
    if(parc===1){
      State.tx.push({ id:uid(), type, amount, cat, who, date:baseDate, desc, due:dueVal||undefined });
    } else {
      for(let i=0;i<parc;i++){
        State.tx.push({ id:uid(), type, amount, cat, who,
          date:addMonthsISO(baseDate,i),
          due: dueVal?addMonthsISO(dueVal,i):undefined,
          desc:(desc||cat)+` - Parcela ${i+1}/${parc}` });
      }
      if(asDebt && type==='out'){
        State.debts.push({ id:uid(), name:desc||cat, total:+(amount*parc).toFixed(2),
          n:parc, paid:1, due: dueVal?(+dueVal.split('-')[2]):5 });
        save('debts', State.debts); renderDebts();
      }
    }
    save('tx', State.tx);
    renderTx(); renderDash(); renderBudget();
  }

  function saveEditTx(id){
    const g=i=>document.getElementById(i);
    const t=State.tx.find(x=>x.id===id); if(!t) return;
    const amount=parseFloat(g('eAmt').value); if(!amount||amount<=0){ g('eAmt').focus(); return; }
    t.type=g('eType').value; t.desc=g('eDesc').value.trim(); t.amount=amount; t.cat=g('eCat').value;
    t.who=g('eWho').value; t.date=g('eDate').value||t.date; t.due=g('eDue').value||undefined;
    const comp=g('eComp').value;
    t.comp = (comp && comp!==(t.date||'').slice(0,7)) ? comp : undefined;
    editingTxId=null;
    save('tx', State.tx);
    renderAll();
  }

  function delTx(id){
    State.tx = State.tx.filter(t=>t.id!==id);
    save('tx', State.tx); renderTx(); renderDash(); renderBudget();

  function categorize(desc){
    const d = (desc||"").toLowerCase();
    for(const [cat,kws] of RULES){ for(const kw of kws){ if(d.includes(kw)) return [cat,true]; } }
    return ["A revisar", false];
  }

  const MESNUM = {JAN:"01",FEV:"02",MAR:"03",ABR:"04",MAI:"05",JUN:"06",JUL:"07",AGO:"08",SET:"09",OUT:"10",NOV:"11",DEZ:"12"};

  function normNum(s){
    if(s==null) return null;
    let x = String(s).replace(/[R$\s\u00a0]/g,"").replace(/[\u2212\u2013\u2014]/g,"-");
    if(/,\d{1,2}$/.test(x)) x = x.replace(/\./g,"").replace(",",".");  // 1.397,00 -> 1397.00
    else x = x.replace(/,/g,"");                                       // 1,397.00 -> 1397.00
    const v = parseFloat(x);
    return isNaN(v)?null:v;
  }
  function normDate(s, fbYear){
    s = String(s||"").trim();
    let m = s.match(/(\d{4})-(\d{2})-(\d{2})/); if(m) return m[1]+"-"+m[2]+"-"+m[3];
    m = s.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})/);
    if(m){ let y=m[3]; if(y.length===2) y="20"+y; return y+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0"); }
    m = s.match(/^(\d{1,2})\s+([A-Za-z]{3})/);
    if(m){ const mm=MESNUM[m[2].toUpperCase()]; if(mm) return (fbYear||"2026")+"-"+mm+"-"+m[1].padStart(2,"0"); }
    return null;
  }

  // Parser de TEXTO colado da fatura (formato Nubank PDF): "28 ABR Estabelecimento R$ 128,55"
  function parseFaturaText(text, year){
    const out=[];
    text.split(/\r?\n/).forEach(line=>{
      const m = line.match(/^\s*(\d{1,2}\s+[A-Za-z]{3})\s+(.+?)\s+([\u2212\u2013\u2014-]?\s*R?\$?\s*[\d.\u00a0]*[\d],\d{2})\s*$/);
      if(!m) return;
      const date = normDate(m[1], year);
      const val  = normNum(m[3]);
      if(date==null || val==null) return;
      out.push({date, desc:m[2].trim().replace(/^"|"$/g,""), raw:val});
    });
    return out;
  }

  // Divide uma linha CSV respeitando aspas
  function splitCSV(line, delim){
    const res=[]; let cur=""; let q=false;
    for(let i=0;i<line.length;i++){ const c=line[i];
      if(c==='"'){ if(q && line[i+1]==='"'){cur+='"';i++;} else q=!q; }
      else if(c===delim && !q){ res.push(cur); cur=""; }
      else cur+=c;
    }
    res.push(cur); return res.map(s=>s.trim());
  }

  // Parser de CSV (fatura ou extrato)
  function parseCSV(text, year){
    const lines = text.split(/\r?\n/).filter(l=>l.trim());
    if(!lines.length) return [];
    const delim = (lines[0].split(";").length > lines[0].split(",").length) ? ";" : ",";
    const rows = lines.map(l=>splitCSV(l, delim));
    let h = rows[0].map(x=>x.toLowerCase());
    let di=-1, vi=-1, ti=-1;
    h.forEach((x,i)=>{
      if(di<0 && /data|date/.test(x)) di=i;
      if(vi<0 && /valor|amount|value|quantia/.test(x)) vi=i;
      if(ti<0 && /desc|title|hist|lan|estabelec|t.tulo/.test(x)) ti=i;
    });
    let start=0;
    if(di>=0||vi>=0||ti>=0){ start=1; if(di<0)di=0; if(ti<0)ti=(di===1?0:1); if(vi<0)vi=rows[0].length-1; }
    else { di=0; ti=1; vi=2; }
    const out=[];
    for(let r=start;r<rows.length;r++){
      const row=rows[r]; if(row.length<2) continue;
      const date=normDate(row[di], year);
      const val=normNum(row[vi]);
      const desc=(row[ti]||"").replace(/^"|"$/g,"").trim();
      if(date==null || val==null) continue;
      out.push({date, desc, raw:val});
    }
    return out;
  }

  // Detecta parcela "x/y" na descrição
  function parcelaInfo(desc){
    if(!/parcela|\d{1,2}\s*\/\s*\d{1,2}/i.test(desc)) return null;
    const m = desc.match(/(\d{1,2})\s*\/\s*(\d{1,2})/);
    if(!m) return null;
    const cur=+m[1], n=+m[2]; if(!n||cur>n) return null;
    const name = desc.replace(/\s*[-–]?\s*parcela\s*\d{1,2}\s*\/\s*\d{1,2}/i,"")
                     .replace(/\s*\d{1,2}\s*\/\s*\d{1,2}\s*$/,"").trim();
    return {name:name||desc, cur, n};
  }

  // Converte itens crus -> linhas de preview já categorizadas
  // competência da fatura = mês de pagamento. Uma fatura é um pagamento só,
  // então todas as linhas recebem a MESMA competência (mês dominante das compras + 1).
  function addMonthYM(ym, k){ let p=ym.split('-').map(Number); let mm=p[1]-1+k; const yy=p[0]+Math.floor(mm/12); mm=((mm%12)+12)%12; return yy+'-'+String(mm+1).padStart(2,'0'); }
  function dominantMonth(items){ const c={}; items.forEach(it=>{const k=(it.date||'').slice(0,7); if(k) c[k]=(c[k]||0)+1;}); let best=null,bn=-1; for(const k in c){ if(c[k]>bn){bn=c[k];best=k;} } return best; }

  function buildPreview(items, source, compOpt){
    const existing = new Set(State.tx.map(t=> t.date+"|"+(t.desc||"").toLowerCase()+"|"+(t.amount).toFixed(2)));
    let batchComp;
    if(compOpt && compOpt.mode==='auto'){ const dm=dominantMonth(items); batchComp = dm ? addMonthYM(dm,1) : undefined; }
    else if(compOpt && compOpt.mode==='fixed'){ batchComp = compOpt.fixed||undefined; }
    else { batchComp = undefined; } // real
    return items.map((it,idx)=>{
      let type, cat, ignore=false, note="";
      const isPay = /pagamento/i.test(it.desc) && it.raw<0;
      if(source==="card"){
        if(isPay){ type="in"; cat="Estorno"; ignore=true; note="pagamento da fatura"; }
        else if(it.raw<0){ type="in"; cat="Estorno"; }
        else { type="out"; [cat]=categorize(it.desc); }
      } else { // account / extrato
        if(it.raw<0){ type="out"; [cat]=categorize(it.desc); }
        else { type="in"; cat="Outros"; }
      }
      const amount = Math.abs(it.raw);
      const key = it.date+"|"+it.desc.toLowerCase()+"|"+amount.toFixed(2);
      const dup = existing.has(key);
      const parc = parcelaInfo(it.desc);
      return { _id:"imp"+idx, date:it.date, desc:it.desc, amount, type, cat,
               include: !(dup||ignore), dup, note, parc, who:"ambos", comp: batchComp||undefined };
    });
  }

      ${pending? `

      ${parcs.length? `<div class="card" style="margin-bottom:16px">

            return `<div class="row" style="${r.include?'':'opacity:.45'}">

              <div class="meta"><div class="t">${esc(r.desc)}</div>
                <div class="s">${ds} ${r.comp?'· <span class="tag" style="background:var(--mint);color:var(--forest)">'+r.comp+'</span>':''} ${r.dup?'· <span class="tag" style="background:var(--gold-soft);color:#8a5d00">já existe</span>':''} ${r.note?'· <span class="tag">'+esc(r.note)+'</span>':''} ${r.cat==='A revisar'?'· <span class="tag" style="background:var(--coral-soft);color:var(--coral)">revisar</span>':''}</div></div>
              <select class="impCat" data-id="${r._id}" style="flex:0 0 160px">${sel}</select>

          }).join("")}
        </div>

          <button class="btn" id="impCommit">✓ Importar ${incl} lançamento(s)</button>

    // wiring
    sec.querySelector('#impAnalyze').onclick = doAnalyze;

    if(srcEl) srcEl.onchange = ()=>{ const m=sec.querySelector('#impCompMode'); if(m) m.value = (srcEl.value==='account')?'real':'auto'; };
    const fileEl = sec.querySelector('#impFile');
    if(fileEl) fileEl.onchange = (e)=>{
      const f=e.target.files[0]; if(!f) return;
      const rd=new FileReader(); rd.onload=()=>{ sec.querySelector('#impText').value = rd.result; }; rd.readAsText(f);

    if(sec.querySelector('#impClear')) sec.querySelector('#impClear').onclick=()=>{ importRows=[]; importMsg=""; renderImport(); };
    sec.querySelectorAll('.impInc').forEach(c=> c.onchange=()=>{ const r=importRows.find(x=>x._id===c.dataset.id); r.include=c.checked; renderImport(); });
    sec.querySelectorAll('.impCat').forEach(s=> s.onchange=()=>{ const r=importRows.find(x=>x._id===s.dataset.id); r.cat=s.value; });
    if(sec.querySelector('#impCommit')) sec.querySelector('#impCommit').onclick=commitImport;
    if(sec.querySelector('#impAddDebts')) sec.querySelector('#impAddDebts').onclick=()=>{
      const checked = Array.from(sec.querySelectorAll('.impParc')).filter(c=>c.checked).map(c=>c.dataset.id);

  function doAnalyze(){
    const sec=document.getElementById('sec-import');
    const source=sec.querySelector('#impSource').value;
    const year=sec.querySelector('#impYear').value||"2026";
    const mode=sec.querySelector('#impCompMode').value;
    const fixed=sec.querySelector('#impComp').value||month;
    const compOpt={mode, fixed};
    lastImportCompMode = mode;
    const text=sec.querySelector('#impText').value.trim();
    if(!text){ importMsg="Cole o conteúdo ou selecione um arquivo primeiro."; renderImport(); return; }
    let items = parseCSV(text, year);
    if(items.length===0) items = parseFaturaText(text, year);  // fallback texto
    if(items.length===0){ importMsg="Não consegui reconhecer linhas. Verifique o formato."; importRows=[]; renderImport(); return; }
    importRows = buildPreview(items, source, compOpt);
    const who=sec.querySelector('#impWho').value; importRows.forEach(r=>r.who=who);
    importMsg = `${items.length} linha(s) reconhecida(s).`;
    renderImport();
  }

  function commitImport(){
    const add = importRows.filter(r=>r.include);
    if(!add.length){ importMsg="Nada marcado para importar."; renderImport(); return; }
    add.forEach(r=>{
      State.tx.push({ id:uid(), type:r.type, amount:r.amount, cat:r.cat, who:r.who||"ambos", date:r.date, desc:r.desc, comp:r.comp||undefined, imp:true });
    });
    save('tx', State.tx);
    const n=add.length;
    const target = add[0].comp || add[0].date.slice(0,7);

    // CORREÇÃO: a lente global precisa combinar com a competência escolhida na importação,
    // senão os lançamentos ficam "invisíveis" no mês pra onde acabamos de navegar.
    // 'auto'/'fixed' = você escolheu o mês de PAGAMENTO -> lente deve ser 'caixa'.
    // 'real' = você quer ver pela data de compra -> lente deve ser 'competencia'.
    const lensBefore = lens;
    lens = (lastImportCompMode==='real') ? 'competencia' : 'caixa';
    save('lens', lens);
    updateLensChips();

    importRows=[]; importMsg="";
    month = target; document.getElementById('mLabel').textContent = monthLabel(month);
    renderLensHint();
    renderAll();
    const btn=document.querySelector('#tabs button[data-tab="tx"]'); if(btn) btn.click();
    const lensMsg = lensBefore!==lens
      ? `\n\n(A lente "Contabilizar por" foi ajustada automaticamente para "${lens==='caixa'?'Mês do pagamento':'Mês da compra'}" para bater com a competência escolhida na importação — senão os lançamentos não apareceriam aqui.)`
      : '';
    alert(n+" lançamento(s) importado(s) com sucesso em "+monthLabel(target)+"!"+lensMsg);
  }

  function addParcelasToDebts(ids){
    const existing=new Set(State.debts.map(d=>d.name.toLowerCase()));
    let added=0;
    ids.forEach(id=>{
      const r=importRows.find(x=>x._id===id); if(!r||!r.parc) return;
      if(existing.has(r.parc.name.toLowerCase())) return;
      State.debts.push({ id:uid(), name:r.parc.name, total:+(r.amount*r.parc.n).toFixed(2),
                         n:r.parc.n, paid:r.parc.cur, due:5 });
      existing.add(r.parc.name.toLowerCase()); added++;
    });
    save('debts', State.debts);
    renderDebts(); renderDash();
    alert(added+" parcelamento(s) adicionado(s) às Dívidas."+(added<ids.length?" (alguns já existiam)":""));
  }


  /* ===================== ANÁLISE DO MÊS ===================== */
  // Classificação de categorias (transparente e editável)
  const ESSENCIAL = ["Mercado","Fruteira","Farmácia","Gasolina","Material escolar","Uniforme","Vacina","Sesi","Seguro carro","Pedagio","Celular","Manutenção","Casa","Casa Sitio","Serviços","Serviços cartorio","Lavar carro","Pet","Uber","Débitos","Rotativo"];
  const IMPULSO   = ["Lanches","Padaria","Restaurante","Shopee","Mercado Livre","Presente","Cuidados pessoais","Produto Mega Hair","Lazer","Jogo"];
  const isEss = c => ESSENCIAL.indexOf(c)>=0;
  const isImp = c => IMPULSO.indexOf(c)>=0;

  function prevMonth(ym){ let p=ym.split('-').map(Number); let m=p[1]-1, y=p[0]; if(m<1){m=12;y--;} return y+'-'+String(m).padStart(2,'0'); }
  function merchKey(t){ return (t.desc||t.cat||'').toLowerCase().replace(/\s*[-–]\s*parcela.*$/,'').replace(/\s+\d{1,2}\s*\/\s*\d{1,2}\s*$/,'').trim(); }

  function analyzeMonth(ym){
    const list = txOfMonth(ym).filter(t=>t.type==='out');
    const total = sum(list.map(t=>t.amount));
    const fixK = sum(list.filter(t=>txKind(t)==='fixa').map(t=>t.amount));
    const parK = sum(list.filter(t=>txKind(t)==='parcela').map(t=>t.amount));
    const varList = list.filter(t=>txKind(t)==='variavel');
    const varTotal = sum(varList.map(t=>t.amount));
    const byCat={}; list.forEach(t=> byCat[t.cat]=(byCat[t.cat]||0)+t.amount);
    const cats = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
    const varByCat={}; varList.forEach(t=> varByCat[t.cat]=(varByCat[t.cat]||0)+t.amount);
    const varCats = Object.entries(varByCat).sort((a,b)=>b[1]-a[1]);
    let essencial=0, superfluo=0;
    varList.forEach(t=>{ if(isEss(t.cat)) essencial+=t.amount; else superfluo+=t.amount; });
    const impList = varList.filter(t=>isImp(t.cat));
    const impTotal = sum(impList.map(t=>t.amount));
    const small = impList.filter(t=>t.amount<30);
    const byMerch={};
    varList.forEach(t=>{ const k=merchKey(t); if(!k) return; (byMerch[k]=byMerch[k]||{n:0,sum:0,name:t.desc||t.cat,cat:t.cat}); byMerch[k].n++; byMerch[k].sum+=t.amount; });
    const repeated = Object.values(byMerch).filter(m=>m.n>=3).sort((a,b)=>b.sum-a.sum);
    const prev = prevMonth(ym);
    const prevList = txOfMonth(prev).filter(t=>t.type==='out');
    const prevTotal = sum(prevList.map(t=>t.amount));
    const prevByCat={}; prevList.forEach(t=> prevByCat[t.cat]=(prevByCat[t.cat]||0)+t.amount);
    const big = list.slice().sort((a,b)=>b.amount-a.amount).slice(0,5);
    return {list,total,fixK,parK,varTotal,byCat,cats,varCats,essencial,superfluo,impList,impTotal,small,repeated,prev,prevTotal,prevByCat,big};
  }

  function renderAnalysis(){

    sec.innerHTML=`

        ${(()=>{const tot=A.total||1;const row=(l,v,c,k)=>`<div class="budline clickable" data-kind="${k}" title="Ver lançamentos desta natureza"><div class="head"><span class="nm">${l}</span><span class="num"><b>${fmt(v)}</b> · ${Math.round(v/tot*100)}%</span></div><div class="bar"><span style="width:${v/tot*100}%;background:${c}"></span></div></div>`;
          return row('🔁 Fixas',A.fixK,'var(--forest)','fixa')+row('🛒 Variáveis',A.varTotal,'var(--gold)','variavel')+row('💳 Parcelas (dívida)',A.parK,'var(--coral)','parcela');})()}
      </div>

      <div class="grid g3" style="margin-bottom:16px">
        <div class="card stat"><div class="k">Total gasto</div><div class="v neg">${fmt(A.total)}</div>
          <div class="hint">${delta===null?'sem mês anterior p/ comparar':(delta>=0?'▲ '+fmt(delta)+' vs '+monthLabel(A.prev):'▼ '+fmt(-delta)+' vs '+monthLabel(A.prev))}</div></div>
        <div class="card stat"><div class="k">Essencial (variável)</div><div class="v pos">${essPct}%</div><div class="hint">${fmt(A.essencial)}</div></div>
        <div class="card stat accent"><div class="k">Supérfluo (variável)</div><div class="v">${supPct}%</div><div class="hint">${fmt(A.superfluo)} — alvo de corte</div></div>
      </div>

      <div class="grid g2" style="margin-bottom:16px">
        <div class="card"><h3>🍩 Para onde foi o dinheiro</h3>${donut(A.cats, A.total)}</div>

    return {
      mes: ym, total: +A.total.toFixed(2),
      essencial: +A.essencial.toFixed(2), superfluo: +A.superfluo.toFixed(2),
      por_categoria: A.cats.map(([c,v])=>({categoria:c, valor:+v.toFixed(2)})),
      maiores_gastos: A.big.map(t=>({desc:t.desc, valor:+t.amount.toFixed(2), cat:t.cat})),
      lugares_recorrentes: A.repeated.slice(0,8).map(m=>({nome:m.name, vezes:m.n, total:+m.sum.toFixed(2), cat:m.cat})),
      compras_pequenas_impulso: A.small.length,
      total_mes_anterior: +A.prevTotal.toFixed(2),
      dividas_em_aberto: State.debts.reduce((a,d)=>a+(d.n-(d.paid||0))*(d.total/d.n),0)
    };
  }

  async function aiAnalysis(){
    const out=document.getElementById('aiOut'); const btn=document.getElementById('aiBtn');
    btn.disabled=true; const old=btn.textContent; btn.textContent='Analisando…';
    out.innerHTML='<div class="desc">Pensando sobre o mês de vocês…</div>';
    const data=buildAISummary(month);
    const prompt = "Você é um consultor financeiro direto e honesto de um casal brasileiro (caixa único). "+
      "Com base no resumo JSON do mês (valores em R$), escreva uma análise curta e prática em português, sem rodeios e sem elogios vazios. "+
      "Estruture em: 1) Diagnóstico (1-2 frases sobre a saúde do mês); 2) Onde estão os maiores vazamentos (cite valores); "+
      "3) Possíveis compras por impulso/emocionais (sinalize padrões, deixe claro que é inferência); 4) 3 ações concretas de economia com R$ estimado. "+
      "Priorize impacto financeiro real (dívidas e grandes gastos) acima de comprinhas pequenas. Seja conciso.\n\nDADOS:\n"+JSON.stringify(data);
    try{
      const resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,messages:[{role:"user",content:prompt}]})});
      const j=await resp.json();
      const text=(j.content||[]).filter(x=>x.type==='text').map(x=>x.text).join("\n");
      if(!text) throw new Error("vazio");
      out.innerHTML = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n{2,}/g,'</p><p>').replace(/\n/g,'<br>').replace(/^/,'<p>').replace(/$/,'</p>');
    }catch(e){
      out.innerHTML='<div class="desc">A análise com IA só roda quando o app está aberto dentro do Claude (ela conversa com o modelo em tempo real). A análise automática acima já cobre os pontos principais offline. Como alternativa, é só me enviar o resumo do mês no chat que eu faço a análise completa.</div>';
    }finally{ btn.disabled=false; btn.textContent=old; }
  }

  // Lança (cria) as fixas que ainda não existem no mês. NUNCA sobrescreve valor já lançado (preserva ajustes pontuais).
  function postFixedForMonth(ym){
    const [y,m]=ym.split('-').map(Number);
    const dim=new Date(y,m,0).getDate();
    let added=0;
    State.fixed.forEach(f=>{
      if((f.start||'0000-00') > ym) return;
      if(fixedPostedTx(f.id, ym)) return;
      const day=f.dueDay? Math.min(f.dueDay,dim) : 1;
      const date=ym+'-'+String(day).padStart(2,'0');
      State.tx.push({ id:uid(), type:'out', amount:f.amount, cat:f.cat, who:f.who||'ambos',
        date, due:f.dueDay?date:undefined, desc:f.name, fixedId:f.id });
      added++;
    });
    if(added){ save('tx',State.tx); }
    renderAll();
    alert(added>0
      ? added+" despesa(s) fixa(s) lançada(s) em "+monthLabel(ym)+"."
      : "Todas as fixas já estavam lançadas em "+monthLabel(ym)+".");
  }

  function addCat(kind){
    const inp=document.getElementById(kind==='out'?'newCatOut':'newCatIn');
    const name=inp.value.trim(); if(!name) return;
    const arr = kind==='out'?CAT_OUT:CAT_IN;
    if(arr.some(c=>c.toLowerCase()===name.toLowerCase())){ alert('Essa categoria já existe.'); return; }
    arr.push(name); saveCats(); renderAll();
  }

  function removeCat(kind, name){
    const arr = kind==='out'?CAT_OUT:CAT_IN;
    if(arr.length<=1){ alert('Mantenha ao menos uma categoria.'); return; }
    const used = State.tx.filter(t=>t.cat===name).length;
    const msg = used
      ? `A categoria "${name}" está em ${used} lançamento(s). Removê-la não apaga esses lançamentos, mas ela some das próximas escolhas. Continuar?`
      : `Remover a categoria "${name}"?`;
    if(!confirm(msg)) return;
    const i=arr.indexOf(name); if(i>=0) arr.splice(i,1);
    saveCats(); renderAll();
  }

  function renameCat(kind, oldName){
    const nn=prompt(`Renomear "${oldName}" para:`, oldName); if(nn===null) return;
    const name=nn.trim(); if(!name) return;
    const arr = kind==='out'?CAT_OUT:CAT_IN;
    if(name!==oldName && arr.some(c=>c.toLowerCase()===name.toLowerCase())){ alert('Já existe uma categoria com esse nome.'); return; }
    const i=arr.indexOf(oldName); if(i<0) return; arr[i]=name;
    // propaga o novo nome para os usos existentes
    State.tx.forEach(t=>{ if(t.cat===oldName) t.cat=name; });
    State.budget.forEach(b=>{ if(b.cat===oldName) b.cat=name; });
    State.fixed.forEach(f=>{ if(f.cat===oldName) f.cat=name; });
    saveCats(); save('tx',State.tx); save('budget',State.budget); save('fixed',State.fixed);
    renderAll();
  }

  (async function init(){
    State.profile = await load('profile', State.profile);
    const seeded = await load('seeded_nubank_jun26', false);
    if(!seeded){
      // primeira execução: carrega a fatura importada
      State.tx     = SEED_TX.slice();
      State.debts  = SEED_DEBTS.slice();
      State.budget = SEED_BUDGET.slice();
      State.goals  = [];
      await save('tx', State.tx);
      await save('debts', State.debts);
      await save('budget', State.budget);
      await save('goals', State.goals);
      await save('seeded_nubank_jun26', true);
    } else {
      State.tx      = await load('tx', []);
      State.budget  = await load('budget', []);
      State.goals   = await load('goals', []);
      State.debts   = await load('debts', []);
    }
    // migração: a fatura importada inicialmente (seed) tem competência junho/2026
    const migComp = await load('mig_comp_jun26', false);
    if(!migComp){
      let changed=false;
      State.tx.forEach(t=>{ if(t.id && String(t.id).indexOf('seed')===0 && !t.comp){ t.comp='2026-06'; changed=true; } });
      if(changed) await save('tx', State.tx);
      await save('mig_comp_jun26', true);
    }
    State.fixed = await load('fixed', []);
    lens = await load('lens', 'competencia');
    const sc = await load('cats', null);
    if(sc && sc.out && sc.in){ CAT_OUT = sc.out; CAT_IN = sc.in; }
    else { await save('cats', {out:CAT_OUT, in:CAT_IN}); }
    // migração: pré-carrega as despesas fixas de maio (planilha família Rodrigues) — só na 1ª vez
    const migFixMaio = await load('mig_fixed_maio', false);
    if(!migFixMaio){
      ["Dízimo","Moradia","Saúde","Escola"].forEach(c=>{ if(CAT_OUT.indexOf(c)<0) CAT_OUT.push(c); });
      await save('cats', {out:CAT_OUT, in:CAT_IN});
      if(State.fixed.length===0){
        State.fixed = SEED_FIXED.map((f,i)=>Object.assign({id:'fxm'+i, start:'2026-05', dueDay:0}, f));
        await save('fixed', State.fixed);
      }
      await save('mig_fixed_maio', true);
    }
    // migração retroativa: lançamentos que já existiam antes da separação "Importadas do cartão"
    // vieram, na prática, todos de faturas importadas do Nubank — marca como importados (imp:true)
    // para aparecerem no grupo certo na aba Lançamentos. Fixas e itens já marcados ficam intocados.
    const migImpRetro = await load('mig_imp_retro_jul26', false);
    if(!migImpRetro){
      let changed=false;
      State.tx.forEach(t=>{ if(t.type==='out' && !t.fixedId && !t.imp){ t.imp=true; changed=true; } });
      if(changed) await save('tx', State.tx);
      await save('mig_imp_retro_jul26', true);
    }
    month = ymNow(); // abre sempre no mês atual
    yearSel = month.slice(0,4);
    shell();
  })();
})();
</script>
